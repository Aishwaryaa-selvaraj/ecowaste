{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="container py-4 auth-wrap" style="max-width:460px">
  <div class="eco-card w-100">
    <div class="auth-logo"><i class="bi bi-recycle"></i></div>
    <h4 class="fw-bold mb-1 text-center">Welcome back</h4><p class="text-center text-muted small mb-3">Login as a household, collector or recycler.</p>
    <form method="post" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Email</label>
      <input class="form-control mb-3" type="email" name="email" required autocomplete="username">
      <label class="form-label">Password</label>
      <input class="form-control mb-2" type="password" name="password" required autocomplete="current-password">
      <div class="text-end mb-3"><a class="small" href="{{ url_for('auth.forgot') }}">Forgot password?</a></div>
      <button class="btn btn-eco w-100">Login</button>
    </form>
    <p class="text-center small mt-3 mb-0">New here? <a href="{{ url_for('auth.register') }}">Create an account</a></p>
  </div>
</div>
{% endblock %}
