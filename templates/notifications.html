{% extends "dash.html" %}
{% block title %}Notifications{% endblock %}
{% block content %}
<h4 class="mb-3">Notifications</h4>
<div class="eco-card">
  {% for n in rows %}
  <div class="d-flex gap-2 py-2 border-bottom">
    <i class="bi bi-bell{{ '-fill text-warning' if not n.is_read }}"></i>
    <div class="flex-grow-1">{{ n.message }}<div class="small text-muted">{{ n.created_at|fdt }}</div></div>
  </div>
  {% else %}<p class="text-muted text-center my-4">No notifications yet.</p>{% endfor %}
</div>
{% endblock %}
