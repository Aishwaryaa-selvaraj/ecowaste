{% extends "base.html" %}
{% block title %}Forgot password{% endblock %}
{% block content %}
<div class="container py-4" style="max-width:440px">
  <div class="eco-card">
    <h4 class="fw-bold mb-3 text-center">Reset your password</h4>
    {% if link %}
    <div class="alert alert-warning small">Demo mode: no email server is configured, so the reset link is shown here:<br><a href="{{ link }}">{{ link }}</a></div>
    {% endif %}
    <form method="post">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <label class="form-label">Registered email</label>
      <input class="form-control mb-3" type="email" name="email" required>
      <button class="btn btn-eco w-100">Get reset link</button>
    </form>
    <p class="text-center small mt-3 mb-0"><a href="{{ url_for('auth.login') }}">Back to login</a></p>
  </div>
</div>
{% endblock %}
