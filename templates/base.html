<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="csrf" content="{{ csrf_token() }}">
<title>{% block title %}ECOWASTE{% endblock %} | ECOWASTE</title>
<link rel="icon" href="{{ url_for('static', filename='images/logo.svg') }}">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Tamil:wght@400;600&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
{% block head %}{% endblock %}
</head>
<body>
{% block body %}
<nav class="navbar navbar-expand-lg eco-nav sticky-top">
  <div class="container">
    <a class="brand" href="{{ url_for('index') }}"><img src="{{ url_for('static', filename='images/logo.svg') }}" alt="">ECOWASTE</a>
    <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#pnav"><span class="navbar-toggler-icon"></span></button>
    <div class="collapse navbar-collapse" id="pnav">
      <ul class="navbar-nav mx-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#top" data-i18n="nav_home">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#how" data-i18n="nav_how">How It Works</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#features" data-i18n="nav_features">Features</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('index') }}#contact" data-i18n="nav_contact">Contact</a></li>
      </ul>
      <div class="d-flex gap-2 align-items-center flex-wrap py-2">
        <button class="lang-btn" data-lang="en" onclick="setLang('en')">EN</button>
        <button class="lang-btn" data-lang="ta" onclick="setLang('ta')">தமிழ்</button>
        {% if session.uid %}
          <a class="btn btn-eco" href="{{ url_for(session.role + '.dashboard') }}" data-i18n="dashboard">Dashboard</a>
        {% else %}
          <a class="btn btn-outline-eco" href="{{ url_for('auth.login') }}" data-i18n="login">Login</a>
          <a class="btn btn-eco" href="{{ url_for('auth.register') }}" data-i18n="register">Register</a>
        {% endif %}
      </div>
    </div>
  </div>
</nav>
<div class="container mt-3">{% include "_flash.html" %}</div>
{% block content %}{% endblock %}
{% endblock %}
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js') }}"></script>
{% block scripts %}{% endblock %}
</body>
</html>
